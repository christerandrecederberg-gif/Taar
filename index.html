<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1240" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tår">
  <title>Tår – barlager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/oversikt" class="logo" aria-label="Tår – til oversikten"></a>
    <h1 id="title">Oversikt</h1>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Hovedmeny">
    <a href="#/oversikt" data-tab="oversikt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
      <span>Oversikt</span><b class="badge" id="badge-low" hidden></b>
    </a>
    <a href="#/lager" data-tab="lager">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v3l1.5 2.5c.33.55.5 1.17.5 1.8V21a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9.3c0-.63.17-1.25.5-1.8L9 5zm0 10v6h6v-6z"/></svg>
      <span>Lager</span>
    </a>
    <a href="#/telling" data-tab="telling">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v2h4a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4zm1.4 13.6-2.5-2.5-1.4 1.4 3.9 3.9 7-7-1.4-1.4z"/></svg>
      <span>Telling</span><b class="badge dot" id="badge-count" hidden></b>
    </a>
    <a href="#/drinker" data-tab="drinker">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18l-8 9v7h4v2H7v-2h4v-7zm4.5 2 1.8 2h5.4l1.8-2z"/></svg>
      <span>Pour cost</span>
    </a>
    <a href="#/mer" data-tab="mer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      <span>Mer</span>
    </a>
  </nav>

  <dialog id="sheet" class="sheet">
    <div class="sheet-grip"></div>
    <button class="sheet-close" data-action="close-sheet" aria-label="Lukk">✕</button>
    <div id="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
